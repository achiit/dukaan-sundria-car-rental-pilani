.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:26px solid var(--rd);opacity:.35}
.hero>*{position:relative;z-index:1}
.btn{display:inline-block;border:0;border-radius:10px;padding:11px 18px;font-weight:600;text-decoration:none;cursor:pointer;background:var(--rd);color:#fff;margin:4px 6px 4px 0}

.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.pad{padding:14px}
.pic{height:96px;display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative}
.tag{position:absolute;left:10px;bottom:8px;font-size:.75rem;background:#000a;color:#fff;border-radius:6px;padding:1px 8px}
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0;text-align:center}
.rates div{background:var(--bg);border-radius:8px;padding:6px 2px;font-size:.78rem;color:var(--mu)}
.rates b{display:block;font:700 1.05rem Oswald,sans-serif;color:var(--tx)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:99px;padding:5px 14px;cursor:pointer}
.chip.on{background:var(--yl);color:#111;border-color:var(--yl)}
.note{background:var(--sf);border-left:5px solid var(--or);padding:10px 14px;border-radius:8px;margin:14px 0;color:var(--mu)}
.st{display:inline-block;font-size:.78rem;border-radius:6px;padding:1px 8px;background:var(--yl);color:#111;margin-right:6px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select.f,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx)}
.cols{display:grid;gap:0 12px;grid-template-columns:1fr 1fr}
table{border-collapse:collapse;width:100%;background:var(--sf);border-radius:10px;overflow:hidden}
td,th{padding:9px 10px;border-bottom:1px solid var(--ln);text-align:left}
.wrap{overflow-x:auto}
footer{background:var(--hd);color:#ccc;padding:22px 14px 90px;border-top:3px solid var(--rd)}
footer div{max-width:1100px;margin:auto}footer a{margin-right:12px;color:#ddd}
.wa{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--gr);color:#fff;border-radius:99px;padding:12px 18px;font-weight:600;text-decoration:none;box-shadow:0 4px 14px #0006}
